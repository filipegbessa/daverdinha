<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Teste de coexistência WhatsApp</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 16px; padding: 12px 20px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>Teste: conectar número existente (coexistência)</h1>
<p>Clique no botão, faça login com a conta do Facebook admin do Business Manager e siga o fluxo até o QR code.</p>
<button id="launch">Conectar WhatsApp (coexistência)</button>
<pre id="result">Aguardando...</pre>

<div id="fb-root"></div>
<script>
  window.fbAsyncInit = function () {
    FB.init({
      appId: '1334903282048146',
      autoLogAppEvents: true,
      xfbml: true,
      version: 'v21.0'
    });
  };

  function log(msg) {
    document.getElementById('result').textContent = msg;
  }

  document.getElementById('launch').addEventListener('click', function () {
    FB.login(function (response) {
      log(JSON.stringify(response, null, 2));
    }, {
      config_id: '1420571823020155',
      response_type: 'code',
      override_default_response_type: true,
      extras: {
        setup: {},
        featureType: 'whatsapp_business_app_onboarding',
        sessionInfoVersion: '3'
      }
    });
  });

  window.addEventListener('message', function (event) {
    if (event.origin !== 'https://www.facebook.com' && event.origin !== 'https://web.facebook.com') return;
    try {
      var data = JSON.parse(event.data);
      log('EVENTO DO SIGNUP:\n' + JSON.stringify(data, null, 2));
      console.log('WA_EMBEDDED_SIGNUP', data);
    } catch (e) {
      // mensagem não é JSON, ignora
    }
  });
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/pt_BR/sdk.js"></script>
</body>
</html>
